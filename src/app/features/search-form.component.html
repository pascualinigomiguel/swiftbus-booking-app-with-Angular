<div class="glass-card p-4 p-md-5">
  <!-- Header with Icon Badge -->
  <div class="d-flex align-items-center mb-4">
    <div class="bg-primary text-white rounded-3 p-3 me-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 52px; height: 52px;">
      <span class="fs-4">🚌</span>
    </div>
    <div>
      <h3 class="fw-bold mb-0">Search Available Buses</h3>
      <p class="text-muted small mb-0">Find and reserve your seats instantly</p>
    </div>
  </div>

  <form class="row g-3 align-items-end">
    <!-- From Location -->
    <div class="col-md-4">
      <label class="form-label fw-semibold text-secondary">From Location</label>
      <select class="form-select">
        <option selected>New York</option>
        <option>Boston</option>
        <option>Washington D.C.</option>
      </select>
    </div>

    <!-- To Location -->
    <div class="col-md-4">
      <label class="form-label fw-semibold text-secondary">To Location</label>
      <select class="form-select">
        <option>New York</option>
        <option selected>Boston</option>
        <option>Washington D.C.</option>
      </select>
    </div>

    <!-- Travel Date -->
    <div class="col-md-4">
      <label class="form-label fw-semibold text-secondary">Travel Date</label>
      <input type="date" class="form-control" value="2026-07-27" />
    </div>

    <!-- Submit Button -->
    <div class="col-12 text-end mt-4">
      <button type="submit" class="btn btn-primary-custom px-4 py-2 fw-semibold">
        Search Buses →
      </button>
    </div>
  </form>
</div>
